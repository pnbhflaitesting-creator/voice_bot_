<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voice Bot</title>
<style>
  :root {
    --bg: #f4f6fb; --panel: #ffffff; --ink: #16181d; --muted: #6b7280;
    --user: #2563eb; --user-ink: #ffffff; --bot: #eef1f6; --bot-ink: #16181d;
    --line: #e4e7ec; --accent: #10b981; --tool: #f59e0b; --danger: #ef4444;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1014; --panel: #171a21; --ink: #e8eaed; --muted: #9aa4b2;
      --user: #3b82f6; --user-ink: #fff; --bot: #232833; --bot-ink: #e8eaed;
      --line: #2a2f3a; --shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--ink); display: flex; justify-content: center;
  }
  .app { width: 100%; max-width: 760px; height: 100vh; display: flex; flex-direction: column; }
  header {
    padding: 14px 18px; display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  .pill {
    margin-left: auto; font-size: 12.5px; font-weight: 600; padding: 5px 11px;
    border-radius: 999px; background: var(--bot); color: var(--muted);
    display: inline-flex; align-items: center; gap: 7px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .pill.listening .dot { background: var(--accent); box-shadow: 0 0 0 0 rgba(16,185,129,.6); animation: pulse 1.6s infinite; }
  .pill.thinking .dot { background: #a855f7; animation: pulse 1s infinite; }
  .pill.speaking .dot { background: var(--user); animation: pulse .7s infinite; }
  .pill.connecting .dot { background: var(--tool); }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(16,185,129,.5)} 70%{box-shadow:0 0 0 7px rgba(16,185,129,0)} 100%{box-shadow:0 0 0 0 rgba(16,185,129,0)} }

  #log { flex: 1; overflow-y: auto; padding: 20px 18px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: 78%; padding: 10px 14px; border-radius: 16px; box-shadow: var(--shadow);
    white-space: pre-wrap; word-wrap: break-word;
  }
  .user .bubble { background: var(--user); color: var(--user-ink); border-bottom-right-radius: 5px; }
  .bot .bubble { background: var(--bot); color: var(--bot-ink); border-bottom-left-radius: 5px; }
  .timing { font-size: 11.5px; color: var(--muted); margin: 3px 4px 0; }
  .tool {
    align-self: center; font-size: 12.5px; color: var(--tool); background: transparent;
    border: 1px dashed var(--tool); border-radius: 999px; padding: 3px 12px; font-family: ui-monospace, monospace;
  }
  .err { align-self: center; color: var(--danger); font-size: 13px; }

  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 14px; }
  .modes { display: flex; gap: 6px; margin-bottom: 10px; }
  .modes button {
    flex: 1; padding: 8px; font-size: 13px; font-weight: 600; border-radius: 10px;
    border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer;
  }
  .modes button.active { background: var(--user); color: #fff; border-color: var(--user); }
  .composer { display: flex; gap: 8px; align-items: center; }
  .composer input {
    flex: 1; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); font-size: 14px; outline: none;
  }
  .composer input:focus { border-color: var(--user); }
  .send, .ptt {
    border: none; border-radius: 12px; padding: 11px 16px; font-size: 14px; font-weight: 600;
    cursor: pointer; color: #fff; background: var(--user);
  }
  .ptt { display: none; background: var(--accent); user-select: none; }
  .ptt.holding { filter: brightness(.9); transform: scale(.98); }
  body[data-mode="ptt"] .ptt { display: inline-block; }
  .hint { font-size: 11.5px; color: var(--muted); margin-top: 8px; text-align: center; }
</style>
</head>
<body data-mode="voice">
  <div class="app">
    <header>
      <h1>🎙️ Voice Bot</h1>
      <span class="pill connecting" id="pill"><span class="dot"></span><span id="pillText">connecting…</span></span>
    </header>
    <div id="log"></div>
    <footer>
      <div class="modes" id="modes">
        <button data-mode="voice" class="active">🎤 Voice (free)</button>
        <button data-mode="ptt">👆 Push-to-talk</button>
        <button data-mode="chat">⌨️ Chat</button>
      </div>
      <div class="composer">
        <input id="text" placeholder="Type a message…" autocomplete="off" />
        <button class="send" id="send">Send</button>
        <button class="ptt" id="ptt">Hold to talk</button>
      </div>
      <div class="hint" id="hint">Voice mode: just speak. You can also type any time.</div>
    </footer>
  </div>

<script>
(function () {
  const logEl = document.getElementById("log");
  const pill = document.getElementById("pill"), pillText = document.getElementById("pillText");
  const textEl = document.getElementById("text"), sendBtn = document.getElementById("send");
  const pttBtn = document.getElementById("ptt"), hint = document.getElementById("hint");
  let ws, liveBot = null;  // liveBot: the bubble being streamed into

  function connect() {
    ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
    ws.onopen = () => setStatus("listening");
    ws.onclose = () => { setStatus("connecting"); pillText.textContent = "reconnecting…"; setTimeout(connect, 1500); };
    ws.onmessage = (e) => handle(JSON.parse(e.data));
  }
  function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

  function setStatus(s) {
    pill.className = "pill " + s;
    pillText.textContent = { connecting: "connecting…", listening: "listening", thinking: "thinking…", speaking: "speaking", idle: "idle" }[s] || s;
  }
  function atBottom() { return logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 80; }
  function scroll() { logEl.scrollTop = logEl.scrollHeight; }

  function addBubble(role, text) {
    const row = document.createElement("div"); row.className = "row " + role;
    const b = document.createElement("div"); b.className = "bubble"; b.textContent = text;
    row.appendChild(b); logEl.appendChild(row); scroll(); return b;
  }
  function addTool(name, args) {
    const stick = atBottom();
    const el = document.createElement("div"); el.className = "tool"; el.textContent = "🛠️ " + name + "(" + (args || "") + ")";
    logEl.appendChild(el); if (stick) scroll();
  }
  function addError(t) { const el = document.createElement("div"); el.className = "err"; el.textContent = "⚠️ " + t; logEl.appendChild(el); scroll(); }
  function addTiming(t) {
    const el = document.createElement("div"); el.className = "timing";
    const parts = [];
    if (t.denoise_ms) parts.push("denoise " + t.denoise_ms + "ms");
    if (t.stt_ms) parts.push("stt " + t.stt_ms + "ms");
    parts.push("llm " + t.llm_ms + "ms"); parts.push("tts " + t.tts_ms + "ms");
    el.textContent = "⏱ " + parts.join(" · ") + " · to-first-audio " + t.ttfa_ms + "ms";
    logEl.appendChild(el); scroll();
  }

  function handle(ev) {
    switch (ev.type) {
      case "status": setStatus(ev.status); break;
      case "message":
        if (ev.role === "bot" && liveBot) { liveBot.textContent = ev.text; liveBot = null; }
        else addBubble(ev.role, ev.text);
        break;
      case "bot_partial":
        if (!liveBot) liveBot = addBubble("bot", "");
        liveBot.textContent += (liveBot.textContent ? " " : "") + ev.text; scroll();
        break;
      case "tool": addTool(ev.name, ev.args); break;
      case "timings": addTiming(ev); break;
      case "error": addError(ev.text); break;
    }
  }

  // ---- composer ----
  function submitText() {
    const t = textEl.value.trim(); if (!t) return;
    send({ type: "user_text", text: t }); textEl.value = ""; liveBot = null;
  }
  sendBtn.onclick = submitText;
  textEl.addEventListener("keydown", (e) => { if (e.key === "Enter") submitText(); });

  // ---- modes ----
  const hints = {
    voice: "Voice mode: just speak. You can also type any time.",
    ptt: "Push-to-talk: hold the green button (or Space) while you speak.",
    chat: "Chat mode: mic is off — type your messages.",
  };
  document.querySelectorAll("#modes button").forEach((btn) => {
    btn.onclick = () => {
      document.querySelectorAll("#modes button").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      const mode = btn.dataset.mode;
      document.body.dataset.mode = mode;
      hint.textContent = hints[mode];
      send({ type: "mode", mode });
    };
  });

  // ---- push-to-talk ----
  let holding = false;
  function pttDown() { if (holding) return; holding = true; pttBtn.classList.add("holding"); send({ type: "mic", on: true }); }
  function pttUp() { if (!holding) return; holding = false; pttBtn.classList.remove("holding"); send({ type: "mic", on: false }); }
  pttBtn.addEventListener("mousedown", pttDown);
  pttBtn.addEventListener("touchstart", (e) => { e.preventDefault(); pttDown(); });
  ["mouseup", "mouseleave", "touchend"].forEach((ev) => pttBtn.addEventListener(ev, pttUp));
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space" && document.body.dataset.mode === "ptt" && document.activeElement !== textEl) { e.preventDefault(); pttDown(); }
  });
  document.addEventListener("keyup", (e) => { if (e.code === "Space") pttUp(); });

  connect();
})();
</script>
</body>
</html>
